# Moduli — reverse proxy to the Node app on localhost:5000.
# Certbot will add the TLS server block + 80->443 redirect on first cert issue.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    # Uploads: app's multer cap is 50MB; give headroom.
    client_max_body_size 64M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # Share → import routing (D14): a shared phone video can be far larger than
    # an upload, so THIS path alone takes up to 500 MB (the app refuses above
    # that with a message naming the limit). Streamed to the app rather than
    # buffered by nginx first, so a big share does not sit on disk twice.
    location = /api/v1/share {
        client_max_body_size 512M;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Websocket upgrade — REQUIRED for Socket.io.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived websockets shouldn't time out at 60s.
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
