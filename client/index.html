<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" href="/viafluere_icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#070b14" />
  <meta name="description" content="Notes, documents, files, records, measurements and dashboards — and the rules that tie them together — in one workspace you assemble yourself, out of pieces that all speak the same language." />
  <link rel="manifest" href="/manifest.json" />
  <title>Viafluere — your desk, revisualized</title>

  <!-- Share cards. /promo/ is NOT under assets/, so the server serves it
       no-cache (server.js static setHeaders) — the image can be replaced
       without a content hash. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Viafluere" />
  <meta property="og:title" content="Viafluere — your desk, revisualized" />
  <meta property="og:description" content="A workspace you assemble, not a screen you are handed. Notes, files, records, dashboards and the rules that connect them — all one system." />
  <meta property="og:image" content="https://viafluere.com/promo/og-card.png" />
  <meta property="og:url" content="https://viafluere.com/" />
  <meta name="twitter:card" content="summary_large_image" />
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <!-- On-device debug console: visit any page with ?debug to load eruda (a
       floating console) + enable the drag/resize probes. Tap the console
       bubble to read [dragPerf] / [resize] logs directly on a tablet. -->
  <script>
    if (location.search.includes('debug') || localStorage.getItem('moduli_debug') === '1') {
      localStorage.setItem('moduli_debug', '1');
      window.__resizeDebug = true;
      window.__dragPerf = true;
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/eruda';
      s.onload = function () { try { window.eruda && window.eruda.init(); } catch (e) {} };
      document.head.appendChild(s);
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
