<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" fill="none" role="img" aria-label="moduli">
  <defs>
    <linearGradient id="lGrad" x1="40" y1="40" x2="860" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#48F2E6"/>
      <stop offset="0.5" stop-color="#39A9E6"/>
      <stop offset="1" stop-color="#2C4FD9"/>
    </linearGradient>
    <linearGradient id="lGradDark" x1="40" y1="40" x2="860" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b3a55"/>
      <stop offset="1" stop-color="#06152e"/>
    </linearGradient>
    <clipPath id="kL"><rect x="0"   y="0" width="170" height="200"/></clipPath>
    <clipPath id="kR"><rect x="170" y="0" width="170" height="200"/></clipPath>
  </defs>

  <!-- ====== MARK ====== -->
  <g transform="translate(0,0)">
    <path
      d="M 40 100
         C 40 50, 100 30, 145 60
         C 175 80, 195 95, 215 100
         C 235 105, 255 110, 285 130
         C 320 150, 320 70, 285 60
         C 255 50, 235 70, 215 100
         C 195 130, 175 145, 145 165
         C 100 195, 40 175, 40 100 Z"
      stroke="url(#lGradDark)" stroke-width="46"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.55"
    />
    <path
      d="M 40 100
         C 40 50, 100 30, 145 60
         C 175 80, 195 95, 215 100
         C 235 105, 255 110, 285 130
         C 320 150, 320 70, 285 60
         C 255 50, 235 70, 215 100
         C 195 130, 175 145, 145 165
         C 100 195, 40 175, 40 100 Z"
      stroke="url(#lGrad)" stroke-width="38"
      stroke-linecap="round" stroke-linejoin="round"
    />
    <path
      d="M 60 100
         C 60 64, 106 50, 142 78
         C 170 96, 192 110, 214 110
         C 238 110, 256 120, 280 134
         C 302 146, 302 78, 280 70
         C 256 62, 238 82, 214 100
         C 192 110, 170 122, 142 138
         C 106 158, 60 142, 60 100 Z"
      stroke="rgba(255,255,255,0.30)" stroke-width="8"
      stroke-linecap="round" stroke-linejoin="round" fill="none"
    />
    <g>
      <path d="M 168 78 C 188 92, 200 100, 215 100"
        stroke="url(#lGrad)" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round" clip-path="url(#kL)" />
      <path d="M 215 100 C 232 100, 242 110, 258 122"
        stroke="url(#lGrad)" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round" clip-path="url(#kR)" />
    </g>
  </g>

  <!-- ====== WORDMARK (translated to sit right of the mark) ====== -->
  <g transform="translate(355,20)"
     fill="none" stroke-width="18"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Dark backer -->
    <g stroke="url(#lGradDark)" opacity="0.55" transform="translate(0,3)">
      <path d="M 0 100 C 0 60, 14 40, 34 40 C 54 40, 68 60, 68 100 C 68 60, 82 40, 102 40 C 122 40, 136 60, 136 100" />
      <path d="M 176 70 C 176 44, 196 30, 216 30 C 236 30, 256 44, 256 70 C 256 96, 236 110, 216 110 C 196 110, 176 96, 176 70 Z" />
      <path d="M 326 10  L 326 110 M 326 70 C 326 44, 308 30, 290 30 C 272 30, 256 44, 256 70 C 256 96, 272 110, 290 110 C 308 110, 326 96, 326 70 Z" />
      <path d="M 366 40 L 366 90 C 366 104, 381 112, 396 112 C 411 112, 428 104, 428 90 L 428 40 L 428 110" />
      <path d="M 476 2  L 476 110" />
      <path d="M 536 40 L 536 110 M 536 10 L 536 16" />
    </g>

    <!-- Main gradient strokes -->
    <g stroke="url(#lGrad)">
      <!-- m -->
      <path d="M 0 100 C 0 60, 14 40, 34 40 C 54 40, 68 60, 68 100 C 68 60, 82 40, 102 40 C 122 40, 136 60, 136 100" />
      <!-- o -->
      <path d="M 176 70 C 176 44, 196 30, 216 30 C 236 30, 256 44, 256 70 C 256 96, 236 110, 216 110 C 196 110, 176 96, 176 70 Z" />
      <!-- d -->
      <path d="M 326 10  L 326 110 M 326 70 C 326 44, 308 30, 290 30 C 272 30, 256 44, 256 70 C 256 96, 272 110, 290 110 C 308 110, 326 96, 326 70 Z" />
      <!-- u -->
      <path d="M 366 40 L 366 90 C 366 104, 381 112, 396 112 C 411 112, 428 104, 428 90 L 428 40 L 428 110" />
      <!-- l -->
      <path d="M 476 2  L 476 110" />
      <!-- i (stem + tittle as tiny ribbon dot) -->
      <path d="M 536 40 L 536 110" />
      <path d="M 536 8 L 536 10" />
    </g>

    <!-- White specular sheen -->
    <g stroke="rgba(255,255,255,0.30)" stroke-width="4">
      <path d="M 8 82 C 14 56, 26 50, 36 50" />
      <path d="M 76 82 C 82 56, 94 50, 104 50" />
      <path d="M 186 58 C 196 42, 208 38, 220 38" />
      <path d="M 266 40 C 290 36, 308 44, 320 58" />
      <path d="M 374 52 C 374 72, 374 82, 378 90" />
      <path d="M 476 20 L 476 90" />
      <path d="M 536 50 L 536 100" />
    </g>
  </g>
</svg>
