<svg xmlns="http://www.w3.org/2000/svg" width="748" height="124" viewBox="42 20 748 124" role="img" aria-label="viafluere">
  <!-- Clean VECTOR lockup: interlocking double-knot mark (gradient ribbons woven
       over/under) + "viafluere" wordmark. Pure geometry — no embedded raster, so
       no broken pixels; tight viewBox so it fills its card edge-to-edge. Replaces
       the speckled raster lockup. -->
  <defs>
    <linearGradient id="vfR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34f5e7"/><stop offset="45%" stop-color="#3ad2ff"/><stop offset="100%" stop-color="#2b4bff"/>
    </linearGradient>
    <linearGradient id="vfS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/><stop offset="38%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="vfBC"><rect x="100" y="84" width="52" height="44"/></clipPath>
  </defs>
  <g transform="translate(8,12)">
    <g transform="rotate(45 158 70)"><rect x="123" y="35" width="70" height="70" rx="20" fill="none" stroke="url(#vfR)" stroke-width="22"/></g>
    <g transform="rotate(45 94 70)"><rect x="59" y="35" width="70" height="70" rx="20" fill="none" stroke="url(#vfR)" stroke-width="22"/></g>
    <g clip-path="url(#vfBC)"><g transform="rotate(45 158 70)"><rect x="123" y="35" width="70" height="70" rx="20" fill="none" stroke="url(#vfR)" stroke-width="22"/></g></g>
    <g opacity="0.9">
      <g transform="rotate(45 94 70)"><rect x="59" y="35" width="70" height="70" rx="20" fill="none" stroke="url(#vfS)" stroke-width="22"/></g>
      <g transform="rotate(45 158 70)"><rect x="123" y="35" width="70" height="70" rx="20" fill="none" stroke="url(#vfS)" stroke-width="22"/></g>
    </g>
  </g>
  <text x="270" y="106" fill="#e6f2f8" font-family="JetBrains Mono, IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="92" font-weight="700" letter-spacing="2">viafluere</text>
</svg>
